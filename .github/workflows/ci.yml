name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一ブランチへの連続pushでは古い実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Syntax check
      # src配下の全JSファイルを構文検証（実行はしない）
      run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
